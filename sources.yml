settings:
  note: DSI V3 sources. Add more small remote first SaaS ATS companies here. Keep
    giants out of strict ICP.
sources:
- name: Remotive Software Dev
  type: remotive_api
  enabled: true
  trust_score: 6
  source_type_label: trusted_remote_board
  categories:
  - software-dev
  - devops-sysadmin
  - data
  limit: 500
  delay_seconds: 0.7
- name: Jobicy Engineering
  type: jobicy_api
  enabled: true
  trust_score: 4
  source_type_label: aggregator
  industries:
  - engineering
  - software-development
  - devops-sysadmin
  limit: 50
  delay_seconds: 0.7
- name: RemoteOK API
  type: remoteok_api
  enabled: true
  trust_score: 5
  source_type_label: remote_board
- name: Arbeitnow Remote API
  type: arbeitnow_api
  enabled: true
  trust_score: 4
  source_type_label: aggregator
  max_pages: 12
  delay_seconds: 0.7
- name: Himalayas Remote API
  type: himalayas_api
  enabled: true
  trust_score: 6
  source_type_label: trusted_remote_board
  queries:
  - engineer
  - developer
  - backend
  - frontend
  - fullstack
  - devops
  - data
  - ai
  - machine learning
  - platform
  - qa
  limit: 100
  delay_seconds: 0.7
- name: WeWorkRemotely Programming RSS
  type: rss
  enabled: true
